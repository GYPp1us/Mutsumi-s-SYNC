runtime_config: config/server-runtime.example.yaml
listen: 127.0.0.1:18240
public_origin: https://hz.arcol.site
base_path: /sync
access_key_env: MUTSUMI_WEB_ACCESS_KEY
onebot_hook_key_env: MUTSUMI_ONEBOT_HOOK_KEY
owner_source:
  actor: web:owner
  kind: human
  relationship: owner
  conversation: web_owner
  reply_target: web_owner
# Optional. Actual IDs and credentials belong in the private server configuration.
napcat: null
# Independent optional official QQ Bot SDK bridge. Never replaces NapCat.
qq_official: null
# Example (use real OpenIDs, not personal QQ numeric IDs):
# qq_official:
#   base_url: http://127.0.0.1:18241
#   token_env: MUTSUMI_QQBOT_BRIDGE_KEY
#   app_id: YOUR_APP_ID
#   bindings:
#     - scope: c2c
#       conversation_id: OWNER_OPENID
#       label: 官方机器人主人私聊
#       senders: { OWNER_OPENID: owner }
#       allow_proactive: false
