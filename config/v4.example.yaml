# Paths resolve relative to the working directory; launch from repository root.
provider:
  base_url: https://api.commandcode.ai/provider/v1
  model: deepseek/deepseek-v4.1-flash
  api_key_env: COMMANDCODE_API_KEY
  timeout_seconds: 90
  max_tokens: 4096
  request_options:
    thinking: {type: disabled}
database: data/v4-prototype/events.sqlite3
prompts: system-prompts.yaml
quick_replies: quick-replies.yaml
max_rounds: 8
max_corrections: 2
directory:
  targets:
    owner_private:
      label: 本地主人私聊测试窗
      account: terminal_bot
      audience: owner
      transport: terminal
    project_group:
      label: 本地项目群测试窗
      account: terminal_bot
      audience: project_members
      transport: terminal
  media: {}
  face_ids: [14, 66]
