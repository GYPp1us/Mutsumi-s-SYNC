<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4 多来源 Playground</title>
<style>body{font:15px/1.6 system-ui,sans-serif;margin:auto;max-width:1300px;padding:28px;background:#10151d;color:#e3eaf4}h1{font-size:26px}button,select,input{font:inherit;padding:7px 12px;background:#202c3c;color:inherit;border:1px solid #43546c;border-radius:6px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.muted{color:#a4b4c8}article,details{background:#182230;border:1px solid #2d4058;padding:14px;margin:12px 0;border-radius:10px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 ui-monospace,monospace}img{max-width:420px;max-height:350px;object-fit:contain;background:white}label{margin-right:12px}.tag{display:inline-block;background:#293f59;border-radius:4px;padding:1px 8px;margin-right:7px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.ok{color:#8ddfb0}.bad{color:#ffaca1}</style>
<h1>V4 多来源 Playground</h1><p class="muted">同一 Runtime / Context / Reviewer / Ledger；真实多模态 API 与本地 HTTP 上传、发送、接收。所有会话与服务文本是回放场景，未连接 QQ。</p>
<nav><select id="run"></select><button data-tab="timeline">异步时间线</button><button data-tab="contexts">模型实际上下文</button><button data-tab="receiver">模拟接收端</button><button data-tab="media">媒体与缓存</button><button data-tab="checks">结果与评估</button></nav>
<label>过滤 <input id="filter" placeholder="来源 / 目标 / event_id / 文本"></label><div id="view"></div>
<script>const report=__REPORT_DATA__;const $=id=>document.getElementById(id);let tab='timeline';report.runs.forEach((r,i)=>{let o=document.createElement('option');o.value=i;o.textContent=r.session;$('run').append(o)});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw()});$('run').onchange=draw;$('filter').oninput=draw;
function pre(value){let p=document.createElement('pre');p.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);return p}
function block(title,value,open=false){let d=document.createElement('details');d.open=open;let s=document.createElement('summary');s.textContent=title;d.append(s,pre(value));return d}
function draw(){const r=report.runs[Number($('run').value)||0],v=$('view'),q=$('filter').value.toLowerCase();v.replaceChildren();const matches=x=>!q||JSON.stringify(x).toLowerCase().includes(q);
if(tab==='timeline'){r.events.filter(e=>e.kind!=='context_snapshot'&&matches(e)).forEach(e=>v.append(block('#'+e.seq+' · '+e.at+' · '+e.kind+' · '+(e.data.source_id||e.data.event_id||''),e.data,['inbound','media_observation','action_result'].includes(e.kind))))}
if(tab==='contexts'){r.events.filter(e=>e.kind==='context_snapshot'&&matches(e)).forEach(e=>v.append(block('#'+e.seq+' · '+e.at+' · provider round '+e.data.round_index,e.data)))}
if(tab==='receiver'){r.receiver.filter(matches).forEach(m=>{let a=document.createElement('article'),h=document.createElement('strong');h.textContent=m.target_ref+' · '+m.message_id+' · '+m.received_at;a.append(h);m.message.forEach(s=>{if(s.type==='text'){a.append(pre(s.data.text))}else if(s.type==='image'){let sha=s.data.file.split('/').pop(),asset=r.received_media.find(x=>x.sha256===sha);if(asset){let img=document.createElement('img');img.src=asset.file;img.alt='模拟接收端重新下载的原始媒体';a.append(img)}}else{a.append(pre(s))}});a.append(block('原生消息段 / action_id',m));v.append(a)})}
if(tab==='media'){(report.input_media||[]).forEach(m=>{let a=document.createElement('article'),img=document.createElement('img');img.src=m.file;img.alt=m.asset_id;a.append(img,pre(m));v.append(a)});v.append(block('缓存统计',{vision_calls:r.vision_calls_including_seed,downloads:r.http_downloads,uploads:r.http_uploads},true));r.events.filter(e=>e.kind==='media_observation'&&matches(e)).forEach(e=>v.append(block(e.data.event_id,e.data,true)));r.received_media.forEach(m=>{let a=document.createElement('article'),img=document.createElement('img');img.src=m.file;a.append(img,pre(m));v.append(a)})}
if(tab==='checks'){v.append(block('确定性检查',{checks:r.checks,outcomes:r.outcomes,triggers:r.triggers,remaining_pending:r.remaining_pending},true),block('独立多模态评估（同模型家族，非人工金标）',report.evaluation,true),block('实际模型 / usage / 耗时',report.provider_metrics),block('解释边界',report.limits,true))}}
draw();</script></html>
